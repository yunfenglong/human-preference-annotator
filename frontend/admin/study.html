<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export responses</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="study.css">
</head>
<body>
  <p><a href="/admin/">Back to dashboard</a></p>
  <h2>Export responses</h2>
  <p id="status" class="muted" role="status" aria-live="polite"></p>
  <section id="login">
    <div class="row">
      <label>Password: <input id="password" type="password" autocomplete="current-password"></label>
      <button id="signIn">Login</button>
    </div>
  </section>
  <section id="operations" hidden>
    <p id="identity" class="muted"></p>
    <h3>Download answers</h3>
    <p>Download new answers for pixelMorph.</p>
    <div class="row">
      <label>Last imported cursor: <input id="after" type="number" min="0" value="0" step="1"></label>
      <button id="download">Download JSON</button>
      <button id="acknowledge" disabled>Mark as imported</button>
    </div>
    <p class="muted">After pixelMorph imports the file, click “Mark as imported”. If the import fails, download it again with the same cursor.</p>
    <h3>Progress</h3>
    <pre id="progress"></pre>
  </section>
  <script src="study.js"></script>
</body>
</html>

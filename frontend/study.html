<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human Preference Annotator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="study.css">
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div id="topbar-left">Human Preference Annotator</div>
      <div id="topbar-center"><span id="progress"></span></div>
      <div id="topbar-right"><button id="logoutBtn" onclick="location.replace('/study.html')">Log out</button></div>
    </div>
    <h2 id="question">Loading study…</h2>
    <p id="status" role="status" aria-live="polite">Loading videos…</p>
    <section id="setup" hidden>
      <p id="setupInstructions"></p>
      <p><label><input type="checkbox" id="setupConfirmed"> My setup matches the instructions above.</label></p>
      <div class="screen-controls">
        <button id="chooseScreen">Select screen</button>
        <select id="screens" aria-label="Stereo display" hidden></select>
        <button id="openScreen">Open player</button>
      </div>
    </section>
    <section id="judgment" hidden>
      <div id="playbackControls">
        <button id="playA" disabled>Play A</button>
        <button id="playB" disabled>Play B</button>
      </div>
      <div id="notes">
        <p>Watch A, then B, all the way through. Replay either if you need to.</p>
        <p>Choose an answer below. It saves automatically.</p>
      </div>
      <div id="buttons" aria-label="Your answer">
        <button data-choice="A" disabled>Prefer A</button>
        <button data-choice="B" disabled>Prefer B</button>
        <button data-choice="tie" disabled>No preference</button>
        <button data-choice="uncertain" disabled>Not sure</button>
        <button data-choice="technical_failure" disabled>Video or display problem</button>
      </div>
    </section>
    <p id="fixture"></p>
  </div>
  <script type="module" src="study.js"></script>
</body>
</html>
